name: Backend Runtime Contract CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contracts:
    name: Python compile and runtime contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest packaging pyyaml fastapi aiofiles sqlalchemy numpy scipy trimesh pillow psutil scikit-image matplotlib pydantic-settings huggingface_hub python-multipart

      - name: Install CPU PyTorch for adapter regression tests
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile backend Python sources
        run: >-
          python -m compileall -q
          backend/adapters backend/api backend/core backend/pipelines
          backend/scripts backend/tests backend/utils backend/loader.py
          patcher scripts

      - name: Run Batch 1 backend regression tests
        run: python -m pytest -q backend/tests/test_batch1_regressions.py

      - name: Run PartField adapter and multipart persistence tests
        run: python -m pytest -q backend/tests/test_partfield_adapter.py

      - name: Run TripoSR unified generation and painting adapter tests
        run: python -m pytest -q backend/tests/test_triposr_adapter.py

      - name: Run selected adapter correctness and resource-lifecycle regressions
        run: >-
          python -m pytest -q
          backend/tests/test_model_adapter_regressions.py
          backend/tests/test_temporary_output_lifecycle.py
          backend/tests/test_stable_fast_3d_patcher.py
          backend/tests/test_skintokens_process_lifecycle.py
          backend/tests/test_hunyuan21_metadata.py
          backend/tests/test_trellis_text_capability.py

      - name: Run workspace lifecycle, regeneration, and API integration contracts
        run: >-
          python -m pytest -q
          backend/tests/test_batch3_queue_and_lifecycle.py
          backend/tests/test_workspace_regeneration.py
          backend/tests/test_batch4_api_integration.py

      - name: Check model and service manager shell syntax
        run: |
          bash -n backend/scripts/download_models.sh
          bash -n manager.sh

  resolver-tests:
    name: Compute mode resolver tests (CPU-only host)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shell script resolver tests
        run: |
          bash scripts/tests/compute_mode_test.sh
          bash scripts/test_env_resolution.sh
