    enabled: true
    vram_requirement: 11000
    max_workers: 1
    supported_inputs:
      - mesh
      - text
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/tencent/Hunyuan3D-2
    capabilities:
      texture_generation: true
      texture_refine: true
      supports_pbr: true
      supports_delighting: true
      supported_texture_resolutions:
