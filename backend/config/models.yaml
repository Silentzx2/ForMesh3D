# ==============================================================================
# ForMesh3D — Single Source of Truth Model Registry (models.yaml)
# ==============================================================================
# - Metadata (`name`, `label`, `description`, `vram_requirement`) drives UI
#   dropdowns, admin catalog, and /api/v1/system/models directly.
# - `default_parameters` are injected at runtime by `multiprocess_scheduler.py`
#   before inference whenever a key is omitted or None (UI values never overwritten).
# - UI-owned parameters (`seed`, `texture_resolution`, `poly_type`, `remesh_option`,
#   `target_polycount`, `target_vertex_count`) stay out of `default_parameters`.
# - Keep model IDs in sync with ModelFactory.ADAPTER_REGISTRY & backend.adapters.
# ==============================================================================

image_to_raw_mesh:

  ## ============================================================================
  ## HY 2.1 (Shape + Optional PBR)
  ## ============================================================================
  hunyuan3d_shape_v21_image_to_raw_mesh:
    name: "HY 2.1"
    label: "Shape + PBR"
    description: "High-detail 3D shape generation with optional PBR texture"
    enabled: true
    vram_requirement: 10240
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/tencent/Hunyuan3D-2.1
    capabilities:
      raw_mesh: true
      texture_generation: true
      image_to_3d: true
      supports_quad_topology: false
      default_topology: Triangle
      min_polycount: 500
      max_polycount: 1000000
      polycount_step: 2500
      output_resolution: 512
      inference_steps:
        min: 20
        max: 60
        default: 50
        step: 5
      guidance_scale:
        min: 3.0
        max: 12.0
        default: 7.5
        step: 0.5
      octree_resolutions:
        - 256
        - 384
        - 512
      high_fidelity_geometry: true
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    model_type: mesh
    default_parameters:
      num_inference_steps: 50
      guidance_scale: 7.5
      octree_resolution: 512
      num_chunks: 8000
      enable_flashvdm: true
      enable_realesrgan: true

  ## ============================================================================
  ## HY 2.0 Mini Turbo (Fast Low-VRAM Shape)
  ## ============================================================================
  hunyuan3d_dit_v2_mini_turbo_image_to_raw_mesh:
    name: "HY 2.0 Mini"
    label: "Fast Shape"
    description: "Fast 0.6B turbo geometry generation for low VRAM"
    enabled: true
    vram_requirement: 6144
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/tencent/Hunyuan3D-2mini
    capabilities:
      raw_mesh: true
      texture_generation: false
      image_to_3d: true
      supports_quad_topology: false
      default_topology: Triangle
      min_polycount: 500
      max_polycount: 1000000
      polycount_step: 2500
      output_resolution: 380
      high_fidelity_geometry: true
      multi_gpu: false
    model_type: mesh
    default_parameters:
      num_inference_steps: 5
      guidance_scale: 5.0
      octree_resolution: 512
      num_chunks: 8000
      enable_flashvdm: true
      enable_realesrgan: true

  ## ============================================================================
  ## TripoSR (Fast Single-Image Mesh)
  ## ============================================================================
  triposr_image_to_raw_mesh:
    name: "TripoSR"
    label: "Fast Shape"
    description: "Fast single-image 3D mesh reconstruction"
    enabled: true
    vram_requirement: 6144
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
    model_path: backend/pretrained/TripoSR
    capabilities:
      raw_mesh: true
      texture_generation: true
      image_to_3d: true
      supports_pbr: false
      texture_maps:
        - base_color
      supported_texture_resolutions:
        - 1K
        - 2K
        - 4K
      default_texture_resolution: 2K
      output_resolution: 512
      supports_quad_topology: false
      default_topology: Triangle
      multi_gpu: false
    model_type: mesh
    default_parameters:
      mc_resolution: 512
      chunk_size: 8192
      foreground_ratio: 0.85

  ## ============================================================================
  ## TripoSG (Hierarchical SDF Shape)
  ## ============================================================================
  triposg_image_to_raw_mesh:
    name: "TripoSG"
    label: "Sharp Shape"
    description: "Hierarchical SDF geometry reconstruction"
    enabled: true
    vram_requirement: 8192
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/TripoSG
    capabilities:
      raw_mesh: true
      texture_generation: false
      image_to_3d: true
      supports_quad_topology: false
      default_topology: Triangle
      min_polycount: 500
      max_polycount: 1000000
      polycount_step: 2500
      output_resolution: 1024
      high_fidelity_geometry: true
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    model_type: mesh
    default_parameters:
      num_inference_steps: 50
      guidance_scale: 7.0
      faces: -1

  ## ============================================================================
  ## TRELLIS (Structured Latent 3D)
  ## ============================================================================
  trellis_image_to_3d:
    name: "TRELLIS"
    label: "Structured 3D"
    description: "Structured latent 3D mesh and appearance generation"
    enabled: true
    vram_requirement: 11776
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/TRELLIS
    capabilities:
      raw_mesh: true
      texture_generation: true
      image_to_3d: true
      supports_quad_topology: false
      default_topology: Triangle
      min_polycount: 500
      max_polycount: 1000000
      polycount_step: 2500
      output_resolution: null
      supported_texture_resolutions:
        - '512'
        - 1K
        - 2K
        - 4K
        - 4K
      default_texture_resolution: 2K
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
    model_type: mesh
    default_parameters:
      ss_sampling_steps: 12
      ss_guidance_strength: 7.5
      slat_sampling_steps: 12
      slat_guidance_strength: 3.0
      simplify: 0.95

  ## ============================================================================
  ## Pixal3D (Disabled)
  ## ============================================================================
  pixal3d_image_to_raw_mesh:
    name: "Pixal3D"
    label: "Camera-Aware Shape"
    description: "Camera-aware single-image 3D shape generation"
    enabled: false
    vram_requirement: 18432
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/Pixal3D
    capabilities:
      raw_mesh: true
      texture_generation: false
      image_to_3d: true
    model_type: mesh
    default_parameters:
      resolution: 1024

  ## ============================================================================
  ## TRELLIS.2 (Disabled)
  ## ============================================================================
  trellis2_image_to_3d:
    name: "TRELLIS.2"
    label: "Cascade 3D"
    description: "Cascaded FlexiDualGrid 3D geometry and texture generation"
    enabled: false
    vram_requirement: 23552
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/TRELLIS.2
    capabilities:
      raw_mesh: true
      texture_generation: false
      image_to_3d: true
    model_type: mesh
    default_parameters:
      pipeline_type: "1536_cascade"

  ## ============================================================================
  ## TaoFlowForge (Disabled)
  ## ============================================================================
  taoflowforge_image_to_raw_mesh:
    name: "TaoFlowForge"
    label: "Flow-Matching"
    description: "Progressive flow-matching native 3D mesh generation"
    enabled: false
    vram_requirement: 20480
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/Taobao3D/TaoFlowForge
    capabilities:
      raw_mesh: true
      texture_generation: false
      image_to_3d: true
    model_type: mesh

image_to_textured_mesh:

  ## ============================================================================
  ## Stable Fast 3D (Instant PBR Mesh)
  ## ============================================================================
  stable_fast_3d_image_to_textured_mesh:
    name: "Stable Fast 3D"
    label: "Instant PBR"
    description: "Sub-second single-image textured mesh generation"
    enabled: true
    vram_requirement: 6144
    max_workers: 1
    supported_inputs:
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/stable-fast-3d
    capabilities:
      raw_mesh: false
      texture_generation: true
