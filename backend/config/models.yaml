        - 2K
        - 4K
      default_texture_resolution: 2K
      supported_material_styles:
        - realistic
        - game
        - stylized
        - anime
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      cpu_offload: true
