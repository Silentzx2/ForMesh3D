      supports_quad_topology: true
      default_topology: Triangle
      min_polycount: 500
      max_polycount: 200000
      polycount_step: 1000
      supported_texture_resolutions:
        - '512'
        - 1K
        - 2K
        - 4K
      default_texture_resolution: 2K
      supports_pbr: true
      supports_delighting: true
      low_vram_supported: true
      multi_gpu: false
    model_type: mesh
    default_parameters:
      foreground_ratio: 0.85
      estimate_illumination: false

image_mesh_painting:

  ## ============================================================================
  ## HY 2.1 Paint (Multi-View PBR)
  ## ============================================================================
  hunyuan3d_paint_v21_image_mesh_painting:
    name: "HY 2.1 Paint"
    label: "PBR Texture"
    description: "Multi-view PBR texture painting for existing meshes"
    enabled: true
    vram_requirement: 12000
    max_workers: 1
    supported_inputs:
      - mesh
      - image
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/tencent/Hunyuan3D-2.1
    capabilities:
      texture_generation: true
      texture_refine: true
      supports_pbr: true
      supports_delighting: true
      supported_texture_resolutions:
        - 1K
        - 2K
        - 4K
      default_texture_resolution: 2K
      supported_material_styles:
        - realistic
        - game
        - stylized
        - anime
      multi_gpu: true
      multi_gpu_strategy: accelerate_component_dispatch
      cpu_offload: true
    model_type: texture
