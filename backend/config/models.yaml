      texture_refine: true
    model_type: texture
    default_parameters:
      pipeline_type: "1024_cascade"

text_mesh_painting:

  ## ============================================================================
  ## TRELLIS Text Paint (Prompt Material)
  ## ============================================================================
  trellis_text_mesh_painting:
    alias_of: trellis_image_mesh_painting
    name: "TRELLIS Text Paint (Unsupported)"
    label: "Unsupported"
    description: "Disabled: ForMesh3D supports image-conditioned TRELLIS only; text-to-3D and text-guided mesh painting are not implemented."
    enabled: false

    default_parameters:
      ss_sampling_steps: 12
      ss_guidance_strength: 7.5
      slat_sampling_steps: 12
      slat_guidance_strength: 3.0

mesh_segmentation:

  ## ============================================================================
  ## PartField (AI 3D Part Segmentation)
  ## ============================================================================
  partfield_segmentation:
    name: "PartField"
    label: "Segmentation"
    description: "AI 3D part feature clustering and segmentation"
    enabled: true
    vram_requirement: 8192
    max_workers: 1
    supported_inputs:
      - obj
      - glb
      - ply
    supported_outputs:
      - glb
      - obj
    default_parameters:
      num_parts: 8
      method: "semantic"
      min_face_island_threshold: 50
      colorize_preview: true
      save_individual_parts: false
      hierarchical: false
      output_format: "glb"
      sample_on_faces: 10
      sample_batch_size: 8192

auto_rig:

  ## ============================================================================
  ## SkinTokens (Autoregressive Auto-Rig)
  ## ============================================================================
  skintokens_auto_rigging:
    name: "SkinTokens"
    label: "Auto-Rig"
    description: "Autoregressive skeleton and skinning weight prediction"
    enabled: true
    vram_requirement: 14336
    low_vram_requirement: 8192
    max_workers: 1
    supported_inputs:
      - obj
      - glb
      - fbx
    supported_outputs:
      - glb
      - fbx
    model_path: backend/pretrained/SkinTokens
    capabilities:
      auto_rig: true
      character_output: true
      low_vram_supported: true
      cpu_offload: true
    model_type: rigging
    default_parameters:
      top_k: 5
      top_p: 0.95
      temperature: 1.0
      repetition_penalty: 2.0
      num_beams: 10
      use_skeleton: false
      use_transfer: true
      use_postprocess: false

mesh_retopology:

  ## ============================================================================
  ## TriFlow (Quad-Dominant Retopology)
  ## ============================================================================
  triflow_retopology:
    name: "TriFlow"
    label: "Retopology"
    description: "Quad-dominant neural retopology"
    enabled: true
    vram_requirement: 10240
    max_workers: 1
    supported_inputs:
      - obj
      - glb
      - ply
      - stl
    supported_outputs:
      - obj
      - glb
    model_path: backend/pretrained/TriFlow
    capabilities:
      retopology: true
      target_polycount: true
      quad_ratio: true
      preserve_features: true
      watertight: true
      multi_gpu: true
      multi_gpu_strategy: accelerate_auto_device_map
    model_type: retopology
    default_parameters:
      quad_ratio: 0.95
      qem_threshold: 12.0
      preserve_features: true
      watertight: false
      adaptive: true
      num_inference_steps: 50
      output_format: "glb"

uv_unwrapping:

  ## ============================================================================
  ## PartUV (Low-Distortion UV Unwrap)
  ## ============================================================================
  partuv_uv_unwrapping:
    name: "PartUV"
    label: "UV Unwrap"
    description: "Low-distortion part-aware UV unwrapping"
    enabled: true
    vram_requirement: 7168
    max_workers: 1
    supported_inputs:
      - obj
      - glb
    supported_outputs:
      - glb
      - obj
    model_path: backend/pretrained/PartUV
    capabilities:
      uv_unwrap: true
    model_type: uv
    default_parameters:
      distortion_threshold: 1.25
      output_format: "glb"
      sample_on_faces: 10
      sample_batch_size: 100000

motion_generation:

  ## ============================================================================
  ## ARDY (CPU Text-to-Motion)
  ## ============================================================================
  ardy_motion_generation:
    name: "ARDY"
    label: "Motion"
    description: "Text-to-motion humanoid animation synthesis"
    enabled: true
    vram_requirement: 0
    max_workers: 1
    supported_inputs:
      - text
    supported_outputs:
      - json
      - npz
    model_path: backend/pretrained/ardy
    capabilities:
      motion_generation: true
      cpu_only: true
    model_type: motion
    default_parameters:
      duration: 4.0
      num_denoising_steps: 10
      cfg_weight: 2.0
      checkpoint: "ARDY-Core-RP-20FPS-Horizon40"
